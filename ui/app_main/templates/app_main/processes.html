{% extends "app_main/base.html" %}

{% block meta %}
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
{% endblock %}

{% block extra_style %}
<style>
.vpane-tab {
  border-radius: 0 !important;
  color: var(--bs-body-color) !important;
  background: var(--bs-gray-400) !important;
  border: none;
  padding: 0.25rem 0.5rem !important;
  font-size: 0.875rem !important;
  text-align: left !important;
}
.vpane-tab.active {
  color: var(--bs-body-color) !important;
  font-weight: 600;
  background: #fff !important;
}
.vpane-tab:not(.active):hover {
  background: var(--bs-gray-300);
}
</style>
{% endblock %}

  <!-- Main content -->
{% block content %}
      <!-- Sidebar: Tree + Element detail -->
      <div class="d-flex flex-column" style="width: 320px; min-width: 250px;">
        <!-- Tree panel -->
        <div class="panel root-panel flex-grow-1">
          <div class="panel-heading">
            <b>Processes</b>
          </div>
          <div class="panel-body root-panel-body p-3">

            <nav class="nav nav-pills flex-column mb-auto" role="tablist">
              <a class="nav-link active" data-bs-toggle="tab" data-bs-target="#pane-workflows"      href="#" role="tab">Workflows</a>
              <a class="nav-link"        data-bs-toggle="tab" data-bs-target="#pane-work-products"  href="#" role="tab">Work Products</a>
              <a class="nav-link"        data-bs-toggle="tab" data-bs-target="#pane-activities"     href="#" role="tab">Activities</a>
            </nav>
          </div>
        </div>

      </div>

      <!-- Main content -->
      <div class="flex-grow-1 overflow-auto">
        <div class="panel root-panel">

          <div class="panel-body root-panel-body tab-content">
            <div class="tab-pane show active p-3" id="pane-workflows"     role="tabpanel"><h6>Workflows</h6></div>
            <div class="tab-pane p-3"             id="pane-work-products" role="tabpanel"><h6>Work Products</h6></div>
            <div class="tab-pane p-3"             id="pane-activities"    role="tabpanel"><h6>Activities</h6></div>
          </div>
        </div>
      </div>
{% endblock %}
